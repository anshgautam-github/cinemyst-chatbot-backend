[project]
name = "cinemyst-chatbot-backend"
version = "0.1.0"
description = "LangGraph + OpenAI + Supabase chatbot backend for CineMyst."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "langchain>=0.3.27",
  "langchain-openai>=0.3.29",
  "langgraph>=0.6.5",
  "pydantic>=2.11.7",
  "pydantic-settings>=2.10.1",
  "python-dotenv>=1.1.1",
  "supabase>=2.16.0",
  "uvicorn[standard]>=0.35.0",
]

[tool.uv]
package = true

